name: Ganamos
options:
  bundleIdPrefix: earth.ganamos
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Ganamos:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: "$(GANAMOS_BUNDLE_ID)"
        DEVELOPMENT_TEAM: "$(GANAMOS_DEVELOPMENT_TEAM)"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Ganamos App Store Local
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Ganamos!
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        CFBundleURLTypes:
          - CFBundleURLName: earth.ganamos.oauth
            CFBundleURLSchemes:
              - ganamos
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Ganamos uses the camera to document community problems and completed fixes.
        NSLocationWhenInUseUsageDescription: Ganamos uses your location to show nearby community fixes.
        NSPhotoLibraryUsageDescription: Ganamos lets you choose photos for community fixes and proof of completion.
        ITSAppUsesNonExemptEncryption: false
        GANAMOS_API_BASE_URL: "$(GANAMOS_API_BASE_URL)"
        GANAMOS_ADMIN_EMAIL: "$(GANAMOS_ADMIN_EMAIL)"
        GANAMOS_SUPABASE_URL: "$(GANAMOS_SUPABASE_URL)"
        GANAMOS_SUPABASE_ANON_KEY: "$(GANAMOS_SUPABASE_ANON_KEY)"
  GanamosTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: Ganamos
  GanamosUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: UITests/Info.plist
    sources:
      - path: UITests
    dependencies:
      - target: Ganamos

schemes:
  Ganamos:
    shared: true
    build:
      targets:
        Ganamos: all
    test:
      targets:
        - GanamosTests
        - GanamosUITests
